<script>
async function copiar() {
  var el = document.getElementById('firma');
  var btn = document.getElementById('btn');
  var st = document.getElementById('status');
  var html = el.innerHTML, text = el.innerText || '';
  function ok() { st.textContent='✓ Copiada. Pégala en Gmail (Ctrl+V / Cmd+V).'; btn.className='btn ok'; btn.textContent='✓ Copiada'; }
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);
      ok(); return;
    }
  } catch(e){}
  var r=document.createRange(); r.selectNodeContents(el); var s=getSelection(); s.removeAllRanges(); s.addRange(r);
  if(document.execCommand('copy')) ok();
}
</script>
